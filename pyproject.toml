[project]
name = "knowledge-transfer"
version = "1.0.0"
description = "Exit-interview knowledge transfer: find what a leaver alone knows, capture it, and build handover plans"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.30",
    "falkordb>=1.7.1",
    "fastapi>=0.143.0",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "falkordblite>=0.10.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    # redislite's async client calls an async shutdown from sync GC cleanup (upstream bug, test-only)
    "ignore:coroutine 'AsyncManagementCommands.shutdown' was never awaited:RuntimeWarning",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["migrations/versions"]  # generated by Alembic autogenerate

[tool.ruff.lint]
# pycodestyle, pyflakes, imports, bugbear, pyupgrade, bandit (security), async, simplify, ruff
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["SIM108"]  # a long ternary reads worse than the if/else it replaces

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ASYNC109"]  # asserts, fake credentials, polling helpers
"sample/**" = ["S"]                      # demo chatbot, not part of the service
"knowledge_transfer/seed/*" = ["E501"]   # data table: one record per line

[tool.ruff.lint.isort]
known-first-party = ["knowledge_transfer"]
