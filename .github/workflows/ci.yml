name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (SQLite + embedded FalkorDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

  test-postgres:
    name: Tests + migrations (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kt
          POSTGRES_PASSWORD: kt
          POSTGRES_DB: kt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kt -d kt_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://kt:kt@localhost:5432/kt_test
      TEST_DATABASE_URL: postgresql+asyncpg://kt:kt@localhost:5432/kt_test
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Migrations round-trip
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

      - name: Run tests
        run: uv run pytest -v

  lint:
    name: Lint and dependency audit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (style, imports, bugbear, bandit security rules)
        run: uv run ruff check --output-format github .

      - name: Known vulnerabilities in runtime dependencies
        run: |
          uv export --locked --no-dev --no-hashes --format requirements-txt > requirements.txt
          uvx pip-audit --no-deps --disable-pip -r requirements.txt

  web:
    name: Web UI (typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Known vulnerabilities in runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: API image
        run: docker build -t kt-api .

      - name: UI image
        run: docker build -t kt-ui frontend
